{% extends "base.html" %}{% block content %}
<h2>Dashboard</h2>
{% if router_error %}
<div class="fault">Router unavailable: {{router_error}}</div>
{% else %}
<div class="card"><b>Router</b><span class="ok">{{router_health.status}}</span><p>Version {{router_health.version}} · uptime {{router_health.uptime}}s</p></div>
{% endif %}
{% endblock %}
